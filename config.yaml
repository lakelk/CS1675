data_root: ~/Data/CS1675
output_dir: output/batch512_100
seed: 42

encoder: resnet18
pretrained_weights: IMAGENET1K_V1
image_size: 224
image_resize: full_image_bilinear
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]
random_image_augmentation: false
feature_cache: features.pt

# PTB tokenization first; fit WordLevel on training captions only.
vocab_min_frequency: 5
max_caption_words: 40
embedding_dim: 256
pretrained_word_embeddings: false
lstm_hidden_dim: 512
transformer_layers: 2
transformer_heads: 4
transformer_ff_dim: 1024
text_position_encoding: fixed_1d_sinusoidal
image_position_encoding: fixed_2d_sinusoidal_row_column_concat
position_base: 10000.0
dropout: 0.1

models:
  A: {pretrained_encoder: false, freeze_encoder: false, decoder: lstm}
  B: {pretrained_encoder: true, freeze_encoder: true, decoder: lstm}
  C: {pretrained_encoder: true, freeze_encoder: true, decoder: transformer}

epochs: 100
learning_rate: 0.0003
min_learning_rate: 0.00003
weight_decay: 0.0001
gradient_clip: 1.0
amp_dtype: float16
effective_batch_size: 512
# CUDA allocator limits in GiB.
gpu_memory_gib: {A: 10.5, B: 10.5, C: 10.5}
batch_sizes: {A: 512, B: 512, C: 512}
validation_batch_sizes: {A: 512, B: 512, C: 512}
num_workers: 4
cpu_threads: 4
checkpoint_metric: CIDEr
checkpoint_split: val
decoding: greedy
automatic_test_evaluation: true
